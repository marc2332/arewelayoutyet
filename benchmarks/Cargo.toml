[package]
name = "taffy_benchmarks"
version = "0.1.0"
authors = [
    "Alice Cecile <alice.i.cecile@gmail.com>",
    "Johnathan Kelley <jkelleyrtp@gmail.com>",
]
edition = "2021"
description = "Benchmarks for the taffy crate"
repository = "https://github.com/DioxusLabs/taffy"
keywords = ["cross-platform", "layout", "benchmarks"]
categories = ["gui", "benchmarks"]
license = "MIT"

[dependencies]
criterion = "0.7"
cephal = { git = "https://github.com/zortax/cephal", rev = "9e77f9100ab3b2f55ade85dd5f24bb987fd28982", optional = true }
serde_json = "1"
clay-layout = { version = "=0.4.0", optional = true }
backer = { version = "=0.12.0", default-features = false, optional = true }
ply-engine = { version = "=1.1.1", default-features = false, optional = true }
rand = { version = "0.9" }
rand_chacha = "0.9"
taffy = { git = "https://github.com/DioxusLabs/taffy", rev = "4e59968eda29ceeb0bbaeb3993c8cd38baa3d0a6" }
taffy_03 = { package = "taffy", version = "0.3", optional = true }
yoga = { version = "0.5.0", optional = true }
ordered-float = { version = "4", optional = true }
slotmap = { version = "1.0.6", optional = true }
morphorm = { version = "0.9.0", optional = true }
torin = { version = "=0.5.0", optional = true }
keru_layout = { version = "=0.1.0", optional = true }
ui_layout = { git = "https://github.com/098orin/ui_layout-rs", rev = "cffdbc4bc0e4f54b9a4466847528fbfa2127648a", optional = true }

[features]
cephal = ["dep:cephal"]
clay = ["dep:clay-layout"]
backer = ["dep:backer"]
ply = ["dep:ply-engine"]
yoga = ["dep:yoga", "dep:slotmap", "dep:ordered-float"]
yoga-super-deep = ["yoga"]
taffy03 = ["dep:taffy_03"]
morphorm = ["dep:morphorm"]
torin = ["dep:torin"]
keru_layout = ["dep:keru_layout"]
ui-layout = ["dep:ui_layout"]
content_size = ["taffy/content_size"]
strict_provenance = ["taffy/strict_provenance"]
small = []
large = []
grid-alternating-spans = []

# The library only contains helpers for the benchmarks. Disabling the default `libtest` bench harness for it
# allows Criterion's CLI options to be passed straight through (e.g. `cargo bench -- --save-baseline main`).
[lib]
bench = false

[[bench]]
name = "pangui"
path = "benches/pangui.rs"
harness = false
