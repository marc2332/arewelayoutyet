name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benchmarks
      - name: Install Yoga build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libclang-dev
      - run: cargo check --manifest-path benchmarks/Cargo.toml --locked --bench pangui --features morphorm,torin,yoga,ui-layout,clay,ply,backer,cephal,keru_layout
      - name: Check Clay adapter
        run: cargo test --manifest-path benchmarks/Cargo.toml --locked --lib --features clay clay_helpers::tests::translates_supported_workloads_and_computes_geometry -- --exact
      - name: Check JavaScript syntax
        run: |
          for script in scripts/*.mjs site/*.js; do
            node --check "$script"
          done
      - run: node scripts/build.mjs
